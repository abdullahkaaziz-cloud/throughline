<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Throughline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/*@CSS@*/</style>
</head>
<body>
<header class="bar">
 <div class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 6c7 0 5 10 12 10" fill="none" stroke="var(--rel)" stroke-width="2" stroke-linecap="round"/><circle cx="5" cy="6" r="3" fill="var(--rel)"/><circle cx="17" cy="16" r="3" fill="var(--rel)"/></svg><b>Throughline</b></div>
 <button class="docbtn" id="docBtn" aria-haspopup="dialog" aria-expanded="false" title="Your essays"><span id="docName">Untitled essay</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
 <button class="btn ghost srcbtn" id="srcBtn" aria-haspopup="dialog" aria-expanded="false" aria-label="Sources"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.6c2-.8 3.8-.8 5.5.4 1.7-1.2 3.5-1.2 5.5-.4v9c-2-.8-3.8-.8-5.5.4-1.7-1.2-3.5-1.2-5.5-.4zM8 4v9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="srclabel">Sources</span><span class="count" id="srcCount" hidden></span></button>
 <div class="modes" role="group" aria-label="Plan or write">
  <button class="mode" type="button" data-mode="plan" aria-pressed="false" aria-label="Plan" title="Plan: brainstorm cards and an outline"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a4 4 0 0 0-2.4 7.2c.5.4.9 1 .9 1.6V12h3v-.7c0-.6.4-1.2.9-1.6A4 4 0 0 0 8 2.5zM6.5 14h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Plan</span></button>
  <button class="mode" type="button" data-mode="write" aria-pressed="true" aria-label="Write" title="Write: the essay and its notes"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3l2.5 2.5-7 7H3.5V10zM9 4.5l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Write</span></button>
  <button class="mode" type="button" data-mode="map" aria-pressed="false" aria-label="Map" title="Map: how all your essays and sources connect"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4.5l7.5 1.5M4 4.5 6 12M11.5 6 6 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="4" cy="4.5" r="2" fill="var(--paper)" stroke="currentColor" stroke-width="1.4"/><circle cx="11.5" cy="6" r="2" fill="var(--paper)" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="12" r="2" fill="var(--paper)" stroke="currentColor" stroke-width="1.4"/></svg><span>Map</span></button>
 </div>
 <span class="spacer"></span>
 <button class="btn ghost aichip" id="aiBtn" aria-haspopup="dialog" aria-expanded="false"><span class="pdot" id="aiDot" data-s="pending"></span><span id="aiName">Claude</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
 <button class="btn primary" id="reviewBtn" title="Review the whole essay (Ctrl+Enter)"><span id="reviewIcon"></span><span id="reviewLabel">Review</span></button>
</header>
<main class="layout">
 <section class="board" id="board" aria-label="Brainstorm board" hidden></section>
 <section class="board compare" id="compare" aria-label="Compare drafts" hidden></section>
 <section class="board rmap" id="rmap" aria-label="Research map" hidden></section>
 <section class="board compare defend" id="defend" aria-label="Defend it" hidden></section>
 <section class="board compare record" id="record" aria-label="Writing record" hidden></section>
 <section class="board compare record progress" id="progress" aria-label="Your progress" hidden></section>
 <section class="board compare record inbox" id="inbox" aria-label="Feedback from testers" hidden></section>
 <article class="paper" id="paper">
  <div class="head">
   <textarea id="title" class="title" rows="1" placeholder="Untitled essay" aria-label="Essay title" autocomplete="off" spellcheck="true"></textarea>
   <div class="meta" id="meta"></div>
  </div>
  <div class="body">
   <div class="gutter"><svg id="gutter" aria-hidden="true"></svg></div>
   <div class="edwrap">
    <div class="parahi" id="parahi" aria-hidden="true"></div>
    <div class="txt backdrop" id="backdrop" aria-hidden="true"></div>
    <textarea class="txt" id="ed" aria-label="Essay text" placeholder="Write here, paste your essay, or drop a .docx, .pdf or .txt file onto the page." spellcheck="true" autocapitalize="sentences"></textarea>
   </div>
   <div class="rmargin" id="rmargin"></div>
  </div>
 </article>
 <aside class="rail" id="rail" aria-label="Notes and argument map">
  <div class="rhead" id="rhead">
   <div class="rtitle"><div class="rtabs" role="tablist" aria-label="Show in this panel"><button class="rtab" role="tab" id="tabNotes" data-view="notes" aria-selected="true" aria-controls="rbody">Notes<small id="rcount"></small></button><button class="rtab" role="tab" id="tabArg" data-view="argument" aria-selected="false" aria-controls="rbody" tabindex="-1">Argument<small id="acount"></small></button></div><button class="sheetbtn" id="sheetBtn" aria-label="Show or hide the panel"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
   <div class="chips" id="chips" role="toolbar" aria-label="Filter notes" hidden></div>
  </div>
  <div class="rbody" id="rbody" role="tabpanel" aria-labelledby="tabNotes"></div>
 </aside>
</main>
<div class="selbar" id="selbar" role="toolbar" aria-label="Ask about the selected text" hidden>
 <button type="button" data-ask="wrong">What’s wrong?</button>
 <button type="button" data-ask="stronger">Make it stronger</button>
 <button type="button" data-ask="follow">Does it follow?</button>
 <form id="selform"><input id="selq" placeholder="Ask anything…" aria-label="Ask about the selection" autocomplete="off"><button type="submit">Ask</button></form>
</div>
<div class="drawer-wrap" id="srcWrap" hidden>
 <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="srcTitle">
  <div class="dhead"><div><b id="srcTitle">Sources</b><span class="sub" id="srcFor"></span></div><button class="x" id="srcClose" aria-label="Close sources">×</button></div>
  <div class="dbody" id="srcBody"></div>
 </aside>
</div>
<div class="pop" id="chipPop" role="dialog" aria-label="Sources that back up this passage" hidden></div>
<div class="menu" id="docMenu" role="dialog" aria-label="Your essays" hidden></div>
<div class="menu" id="aiMenu" role="dialog" aria-label="AI provider and review settings" hidden></div>
<div class="overlay" id="reader" hidden>
 <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
  <div class="shead"><b id="readerTitle"></b><button class="btn sm" id="readerOpen">Open this essay</button><button class="btn sm ghost" id="readerClose">Close</button></div>
  <div class="sbody" id="readerBody"></div>
 </div>
</div>
<div class="overlay" id="dlg" hidden><div class="sheet dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"></div></div>
<div class="drop" id="drop" hidden>Drop essays to add them</div>
<input type="file" id="file" accept=".txt,.md,.markdown,.docx,.pdf,text/plain" multiple hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
{
/*@LIB@*/
/*@APP@*/}
</script>
</body>
</html>
