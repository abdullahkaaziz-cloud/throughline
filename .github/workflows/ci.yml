name: CI
on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repo; no secrets, no write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved; commits can't).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Browser tests (system Chrome, mocked Claude runtime)
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python tools/test_app.py
      - name: Browser tests for the local app (mock ChatGPT sign-in and Responses API)
        run: python tools/test_local.py
